<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1530"/>
      <stop offset="100%" stop-color="#13284c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#87d8ff" stop-opacity="0.46"/>
      <stop offset="65%" stop-color="#67f0d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#67f0d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#bcd8ff"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fd1ff"/>
      <stop offset="100%" stop-color="#63f8cf"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9edbff"/>
      <stop offset="100%" stop-color="#7db4ff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#081327" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="98" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="82" fill="none" stroke="#83b9ff" stroke-opacity="0.24" stroke-width="4"/>
  <circle cx="256" cy="256" r="184" fill="url(#halo)" filter="url(#softGlow)"/>

  <g transform="translate(256 256)" filter="url(#innerShadow)">
    <ellipse rx="176" ry="84" fill="none" stroke="url(#ringA)" stroke-width="14" stroke-opacity="0.8"/>
    <ellipse rx="152" ry="142" fill="none" stroke="url(#ringB)" stroke-width="11" stroke-opacity="0.62" transform="rotate(58)"/>
    <ellipse rx="126" ry="166" fill="none" stroke="url(#ringA)" stroke-width="8" stroke-opacity="0.5" transform="rotate(-42)"/>

    <rect x="-86" y="-86" width="172" height="172" rx="34" fill="#112852" stroke="#8fdaff" stroke-opacity="0.72" stroke-width="6"/>
    <rect x="-76" y="-76" width="152" height="152" rx="28" fill="url(#core)" fill-opacity="0.14"/>
    <text x="0" y="22" text-anchor="middle" fill="#dff2ff" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="3">NX</text>
  </g>
</svg>
